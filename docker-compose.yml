services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bbq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bbq}
      POSTGRES_DB: ${POSTGRES_DB:-bbq}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bbq} -d ${POSTGRES_DB:-bbq}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bbq}:${POSTGRES_PASSWORD:-bbq}@postgres:5432/${POSTGRES_DB:-bbq}?schema=public
      # Photos live on a named volume, outside any web root, and are only ever
      # served through the authenticated, venue-scoped attachment route.
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      PORT: 3001
      # Keeps GET /api/dev/users (the user switcher) available. Set to
      # `production` once real authentication replaces the dev guard.
      NODE_ENV: development
    volumes:
      - uploads:/data/uploads
    ports:
      - '${API_PORT:-3001}:3001'

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Browser-side calls go through the published port...
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
      # ...server components talk to the API container directly.
      API_INTERNAL_URL: http://api:3001/api
    ports:
      - '${WEB_PORT:-3000}:3000'

volumes:
  pgdata:
  uploads:
